<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'SolaimanLipi', sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; text-anchor: middle; }
      .sub { font-family: 'SolaimanLipi', sans-serif; font-size: 13px; fill: #334155; text-anchor: middle; }
      .head { font-family: 'SolaimanLipi', sans-serif; font-size: 16px; font-weight: bold; fill: #047857; }
      .text { font-family: 'SolaimanLipi', sans-serif; font-size: 13px; fill: #1e293b; line-height: 1.5; }
      .bold { font-weight: bold; fill: #0f172a; }
      .meta { font-family: 'SolaimanLipi', sans-serif; font-size: 12px; fill: #475569; }
      .code { font-family: monospace; font-size: 13px; fill: #065f46; font-weight: bold; }
    </style>
  </defs>
  <!-- Paper Background -->
  <rect width="800" height="1130" fill="#ffffff" />
  <rect x="25" y="25" width="750" height="1080" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="29" y="29" width="742" height="1072" fill="none" stroke="#047857" stroke-width="0.8" opacity="0.6" />

  <!-- Top Header -->
  <text x="400" y="70" class="title">বাংলাদেশ ব্যাংক — প্রধান কার্যালয়, ঢাকা</text>
  <text x="400" y="90" class="sub">স্মারক নং: এইচআরডি-১/কর্মী-নিয়োগ/২০২৬-১৮৭ (পৃষ্ঠা - ০২)</text>
  <line x1="50" y1="105" x2="750" y2="105" stroke="#047857" stroke-width="1" />

  <!-- Detailed Terms Block -->
  <text x="60" y="140" class="head">৬. ছবি ও স্বাক্ষর আপলোড সংক্রান্ত নির্দেশিকা:</text>
  <text x="60" y="165" class="text">• ছবি: সম্প্রতি তোলা রঙিন পাসপোর্ট সাইজ ছবি (দৈর্ঘ্য ৩০০ × প্রস্থ ৩০০ পিক্সেল), ফাইল সাইজ অনূর্ধ্ব ১০০ KB হতে হবে।</text>
  <text x="60" y="190" class="text">• স্বাক্ষর: সাদা কাগজে কালো কালির পরিষ্কার স্বাক্ষর (দৈর্ঘ্য ৩০০ × প্রস্থ ৮০ পিক্সেল), ফাইল সাইজ অনূর্ধ্ব ৬০ KB হতে হবে।</text>

  <text x="60" y="235" class="head">৭. পরীক্ষার ফি জমাদান পদ্ধতি (টেলিটক প্রিপেইড):</text>
  <text x="60" y="260" class="text">আবেদন সাবমিটের পর প্রাপ্ত User ID দিয়ে ৭২ ঘণ্টার মধ্যে টেলিটক প্রিপেইড মোবাইল হতে নিম্নরূপে দুটি SMS পাঠাতে হবে:</text>

  <!-- SMS Box -->
  <rect x="60" y="280" width="680" height="100" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text x="80" y="310" class="text"><tspan class="bold">১ম SMS:</tspan> <tspan class="code">BBAD &lt;স্পেস&gt; User ID</tspan> লিখে পাঠিয়ে দিন <tspan class="bold">16222</tspan> নম্বরে।</text>
  <text x="80" y="335" class="text"><tspan class="bold">ফিরতি SMS:</tspan> একটি ৮ ডিজিটের পিন নম্বর (PIN) আসবে এবং মোট ফি জানিয়ে সম্মতি চাওয়া হবে।</text>
  <text x="80" y="360" class="text"><tspan class="bold">২য় SMS:</tspan> <tspan class="code">BBAD &lt;স্পেস&gt; YES &lt;স্পেস&gt; PIN</tspan> লিখে পাঠিয়ে দিন <tspan class="bold">16222</tspan> নম্বরে।</text>

  <text x="60" y="420" class="head">৮. পরীক্ষার মানবণ্টন ও নির্বাচন পদ্ধতি:</text>
  <text x="60" y="445" class="text">• প্রিলিমিনারি পরীক্ষা: ১০০ নম্বরের MCQ (বাংলা ২০, ইংরেজি ২০, গণিত ৩০, সাধারণ জ্ঞান ২০, আইসিটি ১০)। সময় ৬০ মিনিট।</text>
  <text x="60" y="470" class="text">• প্রতিটি ভুল উত্তরের জন্য ০.২৫ নম্বর কর্তন করা হবে। প্রিলিমিনারিতে উত্তীর্ণদের ২০০ নম্বরের লিখিত পরীক্ষায় ডাকা হবে।</text>
  <text x="60" y="495" class="text">• লিখিত পরীক্ষায় উত্তীর্ণদের ২৫ নম্বরের মৌখিক পরীক্ষা (Viva-Voce) গ্রহণপূর্বক চূড়ান্ত মেধা তালিকা প্রকাশ করা হবে।</text>

  <text x="60" y="540" class="head">৯. বিশেষ সতকর্তা ও আইনি বিধান:</text>
  <text x="60" y="565" class="text">• কোনো প্রার্থী জালিয়াতি বা ভুল তথ্যের আশ্রয় নিলে যেকোনো পর্যায়ে তাঁর নিয়োগপত্র সরাসরি বাতিলসহ আইনি ব্যবস্থা নেওয়া হবে।</text>
  <text x="60" y="590" class="text">• নিয়োগ সংক্রান্ত যেকোনো তথ্যের জন্য বাংলাদেশ ব্যাংকের অফিশিয়াল ওয়েব পোর্টাল নিয়মিত পর্যবেক্ষণ করার অনুরোধ করা হলো।</text>

  <!-- Official Seal and Signatures -->
  <g transform="translate(480, 720)">
    <!-- Official Stamp Seal -->
    <circle cx="160" cy="80" r="50" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 3" opacity="0.6" />
    <circle cx="160" cy="80" r="44" fill="none" stroke="#059669" stroke-width="1" opacity="0.6" />
    <text x="160" y="75" font-size="11" font-weight="bold" fill="#047857" text-anchor="middle" font-family="'SolaimanLipi', sans-serif">বাংলাদেশ ব্যাংক</text>
    <text x="160" y="90" font-size="10" fill="#047857" text-anchor="middle" font-family="'SolaimanLipi', sans-serif">কর্মী শাখা, ঢাকা</text>

    <!-- Signature -->
    <path d="M 60 70 Q 90 40 140 60 T 210 50" fill="none" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" />
    <text x="135" y="115" class="bold" font-size="14" text-anchor="middle" font-family="'SolaimanLipi', sans-serif">মোহাম্মদ মোস্তাফিজুর রহমান</text>
    <text x="135" y="132" class="meta" text-anchor="middle">মহাব্যবস্থাপক ও পরিচালক (কর্মী প্রশাসন)</text>
    <text x="135" y="148" class="meta" text-anchor="middle">হিউম্যান রিসোর্সেস ডিপার্টমেন্ট-১</text>
    <text x="135" y="164" class="meta" text-anchor="middle">বাংলাদেশ ব্যাংক, প্রধান কার্যালয়, ঢাকা</text>
  </g>

  <!-- Page Footer Watermark -->
  <line x1="50" y1="1040" x2="750" y2="1040" stroke="#e2e8f0" stroke-width="1" />
  <text x="60" y="1060" class="meta">অফিসিয়াল গেজেট নোটিশ • বাংলাদেশ ব্যাংক • সমাপ্তি পৃষ্ঠা (২ / ২)</text>
  <text x="740" y="1060" class="meta" text-anchor="end">বাংলাদেশ ব্যাংক রিক্রুটমেন্ট ম্যানেজমেন্ট সিস্টেম</text>
</svg>